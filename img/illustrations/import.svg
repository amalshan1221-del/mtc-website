    <g fill="#9FCBB1"><rect x="308" y="180" width="10" height="9"/><rect x="326" y="180" width="10" height="9"/><rect x="308" y="198" width="10" height="9"/><rect x="326" y="198" width="10" height="9"/></g>
    <rect x="316" y="150" width="10" height="20" fill="#187043"/>
