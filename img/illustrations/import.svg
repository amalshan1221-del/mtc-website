    <path d="M300 96h270"/>
  </g>
  <rect x="440" y="80" width="120" height="18" rx="3" fill="#0E4D2F"/>
  <rect x="356" y="98" width="4" height="70" fill="#1F2933"/>
  <rect x="336" y="168" width="44" height="18" rx="2" fill="#D9B48A"/>
