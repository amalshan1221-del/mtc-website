  <path d="M0 270h600v106a24 24 0 0 1-24 24H24a24 24 0 0 1-24-24z" fill="url(#sea)"/>
  <g stroke="#A8D5BA" stroke-width="2.5" stroke-linecap="round" opacity=".5"><path d="M40 310h40M140 340h56M300 372h48M470 330h40M520 362h30"/></g>
