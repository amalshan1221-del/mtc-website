      <rect x="50" y="206" width="56" height="30" fill="#187043"/><rect x="108" y="206" width="56" height="30" fill="#D9B48A"/><rect x="166" y="206" width="56" height="30" fill="#2E8B57"/><rect x="224" y="206" width="56" height="30" fill="#FFFFFF"/>
      <rect x="50" y="174" width="56" height="30" fill="#C9A274"/><rect x="108" y="174" width="56" height="30" fill="#0E4D2F"/><rect x="166" y="174" width="56" height="30" fill="#A8D5BA"/><rect x="224" y="174" width="56" height="30" fill="#187043"/>
      <rect x="108" y="142" width="56" height="30" fill="#2E8B57"/><rect x="166" y="142" width="56" height="30" fill="#E4C49C"/>
      <g stroke="#000" stroke-opacity=".12" stroke-width="2"><path d="M62 210v22M74 210v22M86 210v22M98 210v22M120 210v22M132 210v22M144 210v22M156 210v22M178 210v22M190 210v22M202 210v22M214 210v22M236 210v22M248 210v22M260 210v22M272 210v22M62 178v22M74 178v22M86 178v22M98 178v22M120 178v22M132 178v22M144 178v22M156 178v22M178 178v22M190 178v22M202 178v22M214 178v22M236 178v22M248 178v22M260 178v22M272 178v22M120 146v22M132 146v22M144 146v22M156 146v22M178 146v22M190 146v22M202 146v22M214 146v22"/></g>
    </g>
