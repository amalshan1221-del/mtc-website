    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E8B57"/><stop offset="1" stop-color="#0E4D2F"/></linearGradient>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#sky)"/>
  <circle cx="120" cy="90" r="38" fill="#FFFFFF" opacity=".9"/>
