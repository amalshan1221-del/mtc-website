    <!-- palm trees -->
    <g>
      <path d="M38 398c4-40 2-70-6-104" stroke="#8A6A45" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g fill="#2E8B57"><path d="M32 294c-22-6-36 4-42 14 16-8 28-8 42-14z"/><path d="M32 294c8-20 26-24 40-20-16 2-28 10-40 20z"/><path d="M32 294c-6-18-24-26-38-24 16 4 28 12 38 24z"/><path d="M32 294c20-4 36 6 40 18-14-8-26-10-40-18z"/></g>
      <path d="M500 398c3-30 1-52-5-78" stroke="#8A6A45" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g fill="#3A9A64"><path d="M495 320c-18-5-30 3-35 12 13-7 23-7 35-12z"/><path d="M495 320c7-16 21-20 33-16-13 1-23 8-33 16z"/><path d="M495 320c-5-15-20-21-31-19 13 3 23 10 31 19z"/><path d="M495 320c16-3 30 5 33 15-12-7-21-8-33-15z"/></g>
    </g>

    <!-- pallet stacks on apron -->
    <g>
      <rect x="292" y="414" width="58" height="6" fill="#8A6A45"/><rect x="294" y="420" width="8" height="5" fill="#8A6A45"/><rect x="317" y="420" width="8" height="5" fill="#8A6A45"/><rect x="340" y="420" width="8" height="5" fill="#8A6A45"/>
      <rect x="294" y="388" width="26" height="26" fill="#D9B48A"/><rect x="322" y="388" width="26" height="26" fill="#C9A274"/><rect x="306" y="362" width="28" height="26" fill="#E4C49C"/>
      <path d="M294 401h26M322 401h26M306 375h28" stroke="#B48A5C" stroke-width="1.5"/>
      <rect x="312" y="368" width="10" height="5" fill="#187043"/>
    </g>

    <!-- forklift with pallet -->
    <g>
      <rect x="96" y="384" width="54" height="36" rx="6" fill="#187043"/>
      <path d="M108 384v-26h30l8 26" fill="none" stroke="#1F2933" stroke-width="4" stroke-linejoin="round"/>
      <rect x="138" y="394" width="16" height="22" rx="3" fill="#0E4D2F"/>
      <rect x="88" y="338" width="6" height="84" fill="#1F2933"/>
      <rect x="50" y="418" width="44" height="4" fill="#1F2933"/>
      <rect x="52" y="410" width="40" height="7" fill="#8A6A45"/>
      <rect x="54" y="380" width="18" height="30" fill="#D9B48A"/><rect x="73" y="384" width="18" height="26" fill="#A8D5BA"/><rect x="58" y="360" width="28" height="20" fill="#C9A274"/>
      <circle cx="108" cy="424" r="10" fill="#1F2933"/><circle cx="108" cy="424" r="4" fill="#CBD5D1"/>
      <circle cx="142" cy="424" r="10" fill="#1F2933"/><circle cx="142" cy="424" r="4" fill="#CBD5D1"/>
    </g>

    <!-- delivery truck -->
    <g>
      <rect x="366" y="372" width="176" height="86" rx="6" fill="url(#trail)"/>
      <rect x="366" y="372" width="176" height="10" rx="5" fill="#0E4D2F" opacity=".4"/>
      <path d="M380 432h148" stroke="#A8D5BA" stroke-width="3" stroke-linecap="round"/>
      <text x="454" y="418" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" letter-spacing="2">MTC</text>
      <path d="M548 394h36c6 0 10 2 13 7l15 22c2 3 3 6 3 9v26h-67z" fill="#0E4D2F"/>
      <path d="M556 402h26c3 0 5 1 7 4l11 16h-44z" fill="#BFDCCB"/>
      <rect x="600" y="440" width="15" height="8" rx="2" fill="#F2B544"/>
      <rect x="540" y="386" width="8" height="72" fill="#1F2933"/>
      <rect x="362" y="456" width="256" height="8" rx="3" fill="#1F2933"/>
      <circle cx="404" cy="466" r="17" fill="#1F2933"/><circle cx="404" cy="466" r="7" fill="#CBD5D1"/>
      <circle cx="446" cy="466" r="17" fill="#1F2933"/><circle cx="446" cy="466" r="7" fill="#CBD5D1"/>
      <circle cx="584" cy="466" r="17" fill="#1F2933"/><circle cx="584" cy="466" r="7" fill="#CBD5D1"/>
    </g>

    <!-- route line + pin -->
    <path d="M598 360c30-60-10-120 -60-150" fill="none" stroke="#187043" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round" opacity=".55"/>
    <g transform="translate(524 176)">
      <path d="M14 0C6 0 0 6 0 14c0 11 14 24 14 24s14-13 14-24C28 6 22 0 14 0z" fill="#187043"/>
      <circle cx="14" cy="14" r="5.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
