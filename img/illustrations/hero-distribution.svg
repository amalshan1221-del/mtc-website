<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t">
  <title id="t">MTC distribution centre with loading docks, pallets of stock, a forklift and a delivery truck</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDEEE4"/><stop offset="1" stop-color="#F6FBF8"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF4F0"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E8250"/><stop offset="1" stop-color="#166B40"/></linearGradient>
    <pattern id="siding" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="none"/><path d="M0 11.5h12" stroke="#E2EBE5" stroke-width="1"/></pattern>
    <pattern id="shutter" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#D6DFDA"/><path d="M0 7.5h8" stroke="#BCC8C1" stroke-width="1.2"/></pattern>
    <clipPath id="frame"><rect width="640" height="520" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="640" height="520" fill="url(#sky)"/>
    <!-- sun + clouds -->
    <circle cx="540" cy="92" r="46" fill="#FFFFFF" opacity=".9"/>
    <circle cx="540" cy="92" r="70" fill="#FFFFFF" opacity=".35"/>
    <g fill="#FFFFFF" opacity=".95">
      <path d="M96 96c0-13 11-22 23-20 5-10 17-15 28-10 9-8 25-4 28 9 12 0 19 10 16 21H96z"/>
      <path d="M380 70c0-9 8-15 16-14 4-7 12-10 20-7 6-5 17-3 20 6 8 0 13 7 11 15h-67z" opacity=".8"/>
    </g>
    <!-- skyline -->
    <g fill="#C9E0D2">
      <rect x="470" y="222" width="34" height="180"/><rect x="508" y="184" width="40" height="218"/><rect x="552" y="236" width="26" height="166"/>
      <rect x="582" y="200" width="44" height="202"/><rect x="18" y="246" width="30" height="156"/><rect x="0" y="270" width="20" height="132"/>
    </g>
    <g fill="#B8D6C4">
      <rect x="516" y="196" width="6" height="8"/><rect x="530" y="196" width="6" height="8"/><rect x="516" y="214" width="6" height="8"/><rect x="530" y="214" width="6" height="8"/>
      <rect x="590" y="212" width="6" height="8"/><rect x="604" y="212" width="6" height="8"/><rect x="590" y="230" width="6" height="8"/><rect x="604" y="230" width="6" height="8"/>
    </g>
    <!-- ground -->
    <rect y="398" width="640" height="122" fill="#D3E5DA"/>
    <rect y="398" width="640" height="44" fill="#E6EFE9"/>
    <!-- road -->
    <rect y="442" width="640" height="54" fill="#1F2933"/>
    <path d="M0 469h640" stroke="#F2F5F3" stroke-width="3" stroke-dasharray="26 18" opacity=".7"/>
    <rect y="496" width="640" height="24" fill="#C3DBCC"/>

