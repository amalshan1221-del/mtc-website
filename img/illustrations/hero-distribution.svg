        <g stroke="#2F6B4C" stroke-width="3"><path d="M186 300v98M246 300v98M186 330h60M186 362h60"/></g>
        <g><rect x="192" y="312" width="16" height="16" fill="#D9B48A"/><rect x="211" y="314" width="14" height="14" fill="#C9A274"/><rect x="228" y="310" width="15" height="18" fill="#E4C49C"/>
          <rect x="192" y="342" width="20" height="18" fill="#C9A274"/><rect x="215" y="344" width="14" height="16" fill="#D9B48A"/><rect x="231" y="340" width="12" height="20" fill="#A8D5BA"/></g>
        <rect x="272" y="296" width="80" height="102" fill="url(#shutter)"/>
        <rect x="266" y="288" width="92" height="9" rx="2" fill="#1F2933"/>
        <g fill="#F2B544"><rect x="80" y="392" width="12" height="6"/><rect x="148" y="392" width="12" height="6"/><rect x="272" y="392" width="12" height="6"/><rect x="340" y="392" width="12" height="6"/></g>
      </g>
      <!-- office block -->
      <rect x="370" y="286" width="94" height="112" fill="#F6FAF7"/>
      <g fill="#9FCBB1"><rect x="380" y="298" width="32" height="26" rx="2"/><rect x="422" y="298" width="32" height="26" rx="2"/><rect x="380" y="334" width="32" height="26" rx="2"/><rect x="422" y="334" width="32" height="26" rx="2"/></g>
      <rect x="402" y="368" width="30" height="30" fill="#187043"/>
