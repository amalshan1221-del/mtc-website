      <path d="M52 206 262 150l212 56v8H52z" fill="#0A3A23" opacity=".35"/>
      <rect x="62" y="206" width="402" height="192" fill="url(#wall)"/>
      <rect x="62" y="206" width="402" height="192" fill="url(#siding)"/>
      <!-- brand band -->
      <rect x="62" y="214" width="402" height="36" fill="#187043"/>
      <text x="263" y="238" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="3">MTC · DISTRIBUTION CENTRE</text>
      <!-- clerestory windows -->
      <g fill="#BFDCCB"><rect x="84" y="262" width="54" height="16" rx="3"/><rect x="152" y="262" width="54" height="16" rx="3"/><rect x="220" y="262" width="54" height="16" rx="3"/><rect x="288" y="262" width="54" height="16" rx="3"/></g>
      <!-- docks -->
      <g>
        <rect x="80" y="296" width="80" height="102" fill="url(#shutter)"/>
        <rect x="74" y="288" width="92" height="9" rx="2" fill="#1F2933"/>
        <rect x="176" y="296" width="80" height="102" fill="#163A2A"/>
        <rect x="170" y="288" width="92" height="9" rx="2" fill="#1F2933"/>
